<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>流浪地球 - 春节十二响 | 全屏模拟器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            overflow: hidden;
            background: #000;
        }
        
        canvas {
            display: block;
        }
        
        .instructions {
            position: fixed;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #4ecdc4;
            max-width: 300px;
            backdrop-filter: blur(5px);
            z-index: 10;
        }
        
        .instructions h3 {
            color: #4ecdc4;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }
        
        .instructions ul {
            list-style: none;
            padding-left: 0;
        }
        
        .instructions li {
            margin-bottom: 8px;
            color: #a0a0ff;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
        }
        
        .instructions li:before {
            content: "•";
            color: #ff6b6b;
            margin-right: 8px;
            font-size: 1.2rem;
        }
        
        .performance-info {
            position: fixed;
            top: 20px;
            right: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 10px;
            border-left: 4px solid #ff8e53;
            font-size: 0.9rem;
            backdrop-filter: blur(5px);
            z-index: 10;
        }
        
        .performance-info div {
            margin-bottom: 5px;
        }
        
        .fps {
            color: #4ecdc4;
            font-weight: bold;
        }
        
        .vertex-count {
            color: #ff8e53;
        }
        
        .memory {
            color: #a0a0ff;
        }
        
        .hotkeys {
            position: fixed;
            bottom: 80px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 10px;
            border-left: 4px solid #ff6b6b;
            font-size: 0.9rem;
            backdrop-filter: blur(5px);
            z-index: 10;
        }
        
        .hotkey-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            padding: 3px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .key {
            background: rgba(255, 107, 107, 0.3);
            padding: 2px 8px;
            border-radius: 4px;
            font-family: monospace;
            color: #ff6b6b;
        }
        
        .action {
            color: #a0a0ff;
        }
        
        .fullscreen-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(78, 205, 196, 0.3);
            border: 1px solid rgba(78, 205, 196, 0.5);
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            z-index: 10;
        }
        
        .fullscreen-btn:hover {
            background: rgba(78, 205, 196, 0.5);
            box-shadow: 0 0 15px rgba(78, 205, 196, 0.3);
        }
        
        @media (max-width: 768px) {
            .instructions, .performance-info, .hotkeys {
                display: none;
            }
        }
        

    </style>
</head>
<body>

    
    <div class="instructions">
        <h3>行星发动机模拟器</h3>
        <ul>
            <li>基于李一一的原始代码</li>
            <li>36.9MB OBJ模型优化加载</li>
            <li>自动顶点简化处理</li>
            <li>实时性能监控</li>
        </ul>
    </div>
    
    <div class="performance-info">
        <div>FPS: <span class="fps" id="fps">--</span></div>
        <div>顶点: <span class="vertex-count" id="vertex-count">--</span></div>
        <div>内存: <span class="memory" id="memory">--</span></div>
    </div>
    
    <div class="hotkeys">
        <div class="hotkey-item">
            <span class="key">空格键</span>
            <span class="action">启动十二响</span>
        </div>
        <div class="hotkey-item">
            <span class="key">R 键</span>
            <span class="action">重置系统</span>
        </div>
        <div class="hotkey-item">
            <span class="key">ESC 键</span>
            <span class="action">停止脉冲</span>
        </div>
        <div class="hotkey-item">
            <span class="key">鼠标拖拽</span>
            <span class="action">旋转视角</span>
        </div>
        <div class="hotkey-item">
            <span class="key">滚轮</span>
            <span class="action">缩放视角</span>
        </div>
    </div>
    
    <button class="fullscreen-btn" id="fullscreen-btn">全屏模式</button>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.0/examples/jsm/"
        }
    }
    </script>
    
    <script type="module" src="simulator_minimal.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            setupFullscreen();
            startPerformanceMonitor();
        });
        
        function setupFullscreen() {
            const fullscreenBtn = document.getElementById('fullscreen-btn');
            
            fullscreenBtn.addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(err => {
                        console.log(`全屏请求失败: ${err.message}`);
                    });
                    fullscreenBtn.textContent = '退出全屏';
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                        fullscreenBtn.textContent = '全屏模式';
                    }
                }
            });
            
            document.addEventListener('fullscreenchange', () => {
                if (!document.fullscreenElement) {
                    fullscreenBtn.textContent = '全屏模式';
                }
            });
            
            document.addEventListener('keydown', (e) => {
                if (e.key === 'f' || e.key === 'F') {
                    e.preventDefault();
                    fullscreenBtn.click();
                }
            });
        }
        
        function startPerformanceMonitor() {
            let frameCount = 0;
            let lastTime = performance.now();
            let fps = 0;
            
            function updatePerformance() {
                frameCount++;
                const currentTime = performance.now();
                
                if (currentTime - lastTime >= 1000) {
                    fps = Math.round((frameCount * 1000) / (currentTime - lastTime));
                    frameCount = 0;
                    lastTime = currentTime;
                    
                    document.getElementById('fps').textContent = fps;
                    
                    if (fps < 30) {
                        document.getElementById('fps').style.color = '#ff6b6b';
                    } else if (fps < 50) {
                        document.getElementById('fps').style.color = '#ff8e53';
                    } else {
                        document.getElementById('fps').style.color = '#4ecdc4';
                    }
                    
                    if (performance.memory) {
                        const usedMB = Math.round(performance.memory.usedJSHeapSize / 1024 / 1024);
                        const totalMB = Math.round(performance.memory.totalJSHeapSize / 1024 / 1024);
                        document.getElementById('memory').textContent = `${usedMB}MB / ${totalMB}MB`;
                    }
                }
                
                requestAnimationFrame(updatePerformance);
            }
            
            updatePerformance();
        }
    </script>
</body>
</html>
